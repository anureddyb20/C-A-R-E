<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caregiver Live Monitor</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #111; color: #fff; margin: 0; padding: 20px; }
        h1 { text-align: center; color: #4ade80; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 20px; }
        .card { background: #222; padding: 20px; border-radius: 10px; text-align: center; border: 1px solid #333; }
        .value { font-size: 3em; font-weight: bold; margin: 10px 0; }
        .chart-container { background: #222; padding: 20px; border-radius: 10px; height: 400px; border: 1px solid #333; }
        .alert { color: #ef4444; animation: flash 1s infinite; }
        @keyframes flash { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 1; } }
        #connection { text-align: center; margin-bottom: 20px; color: #fbbf24; }
    </style>
</head>
<body>

    <h1>VitalBand Caregiver Monitor</h1>
    <div id="connection">Enter ESP32 IP to connect...</div>
    
    <div style="text-align: center; margin-bottom: 20px;">
        <input type="text" id="ipInput" placeholder="192.168.x.x" style="padding: 5px;">
        <button onclick="connect()" style="padding: 5px 15px; cursor: pointer;">Connect</button>
    </div>

    <div class="grid">
        <div class="card">
            <h3>Heart Rate</h3>
            <div class="value" id="bpmValue" style="color: #f87171;">--</div>
            <div>BPM</div>
        </div>
        <div class="card">
            <h3>Stress Level (GSR)</h3>
            <div class="value" id="gsrValue" style="color: #60a5fa;">--</div>
            <div>Raw ADC</div>
        </div>
        <div class="card" id="statusCard">
            <h3>Patient Status</h3>
            <div class="value" id="statusValue" style="color: #4ade80; font-size: 2em;">Normal</div>
        </div>
    </div>

    <div class="chart-container">
        <canvas id="ecgChart"></canvas>
    </div>

    <script>
        let ws;
        
        // Chart Setup
        const ctx = document.getElementById('ecgChart').getContext('2d');
        const maxDataPoints = 100;
        
        const ecgChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: Array(maxDataPoints).fill(''),
                datasets: [{
                    label: 'ECG Trace',
                    data: Array(maxDataPoints).fill(0),
                    borderColor: '#4ade80',
                    borderWidth: 2,
                    pointRadius: 0,
                    tension: 0.1
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: false,
                scales: {
                    y: { 
                        min: 0, 
                        max: 4095, // 12-bit ADC max
                        grid: { color: '#333' }
                    },
                    x: { grid: { display: false } }
                },
                plugins: { legend: { display: false } }
            }
        });

        function connect() {
            const ip = document.getElementById('ipInput').value;
            if(!ip) return;
            
            if(ws) ws.close();
            
            document.getElementById('connection').innerText = `Connecting to ws://${ip}:81...`;
            ws = new WebSocket(`ws://${ip}:81`);

            ws.onopen = () => {
                document.getElementById('connection').innerText = "🟢 Connected";
                document.getElementById('connection').style.color = "#4ade80";
            };

            ws.onclose = () => {
                document.getElementById('connection').innerText = "🔴 Disconnected";
                document.getElementById('connection').style.color = "#ef4444";
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                
                // Update text
                document.getElementById('bpmValue').innerText = data.bpm;
                document.getElementById('gsrValue').innerText = data.gsr;
                
                // Status Logic
                const statusCard = document.getElementById('statusCard');
                const statusValue = document.getElementById('statusValue');
                
                if (data.panic) {
                    statusValue.innerText = "PANIC BUTTON!";
                    statusValue.className = "value alert";
                    statusCard.style.border = "2px solid #ef4444";
                } else if (data.leads_off) {
                    statusValue.innerText = "Check Sensors";
                    statusValue.className = "value";
                    statusValue.style.color = "#fbbf24";
                    statusCard.style.border = "1px solid #333";
                } else if (data.bpm > 120 || (data.bpm > 0 && data.bpm < 50)) {
                    statusValue.innerText = "HR ALERT";
                    statusValue.className = "value alert";
                    statusCard.style.border = "2px solid #ef4444";
                } else {
                    statusValue.innerText = "Normal";
                    statusValue.className = "value";
                    statusValue.style.color = "#4ade80";
                    statusCard.style.border = "1px solid #333";
                }

                // Update Chart
                let chartData = ecgChart.data.datasets[0].data;
                chartData.push(data.ecg);
                if (chartData.length > maxDataPoints) chartData.shift();
                ecgChart.update();
            };
        }
    </script>
</body>
</html>
