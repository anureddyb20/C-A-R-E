<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C.A.R.E. | Secure Health Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h1>C.A.R.E.</h1>
            <p>Secure Medical Telemetry Portal</p>
        </div>

        <form id="loginForm" onsubmit="event.preventDefault(); handleLogin();">
            <div class="role-selector">
                <button type="button" class="role-btn" onclick="selectRole('patient')" id="btn-patient">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    I am a Patient
                </button>
                <button type="button" class="role-btn" onclick="selectRole('therapist')" id="btn-therapist">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"></path></svg>
                    I am a Therapist / Caregiver
                </button>
                <button type="button" class="role-btn" onclick="selectRole('admin')" id="btn-admin">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                    I am a System Admin
                </button>
            </div>

            <div class="login-fields" style="display: flex; flex-direction: column; gap: 15px; margin-bottom: 20px; text-align: left;">
                <div>
                    <label for="username" style="font-size: 0.9rem; font-weight: 600; color: var(--text-main); margin-bottom: 5px; display: block;">Username / ID</label>
                    <input type="text" id="username" placeholder="Enter your ID" required style="width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 1rem; box-sizing: border-box; outline: none;">
                </div>
                <div>
                    <label for="password" style="font-size: 0.9rem; font-weight: 600; color: var(--text-main); margin-bottom: 5px; display: block;">Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required style="width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 1rem; box-sizing: border-box; outline: none;">
                </div>
            </div>

            <div class="terms-checkbox">
                <input type="checkbox" id="terms" required>
                <label for="terms">I agree to the <a href="privacy_policy.html" target="_blank">Privacy Policy & HIPAA Terms</a></label>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 16px; font-size: 1.1rem; border-radius: 12px;">Access Dashboard</button>
        </form>
    </div>
</div>

<script>
    let selectedRole = '';

    function selectRole(role) {
        selectedRole = role;
        
        // Reset styles
        document.querySelectorAll('.role-btn').forEach(btn => {
            btn.style.borderColor = 'var(--border)';
            btn.style.backgroundColor = 'var(--bg-card)';
            btn.style.color = 'var(--text-main)';
        });

        // Apply active style
        const activeBtn = document.getElementById(`btn-${role}`);
        activeBtn.style.borderColor = 'var(--primary)';
        activeBtn.style.backgroundColor = '#F0FDFA';
        activeBtn.style.color = 'var(--primary)';
    }

    function handleLogin() {
        if (!selectedRole) {
            alert('Please select a role to continue.');
            return;
        }

        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;

        if (!username || !password) {
            alert('Please enter your ID and password.');
            return;
        }

        const terms = document.getElementById('terms').checked;
        if (!terms) {
            alert('You must accept the privacy policy to proceed.');
            return;
        }

        // Route to the correct dashboard based on role selection
        if (selectedRole === 'patient') {
            window.location.href = 'patient_dashboard.html';
        } else if (selectedRole === 'therapist') {
            window.location.href = 'therapist_dashboard.html';
        } else if (selectedRole === 'admin') {
            window.location.href = 'admin_dashboard.html';
        }
    }
</script>

</body>
</html>
